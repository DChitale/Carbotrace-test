name: Carbotrace Carbon Audit

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  carbon-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Audit PR Carbon Delta
        uses: DChitale/Carbotrace/action@version-2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          carbotrace-url: 'https://carbotrace-backend.onrender.com/api'
          threshold: '0.1'
